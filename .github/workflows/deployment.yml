name: Deploy to Github Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checking out the latest code
        uses: actions/checkout@v4

      - name: Setting up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: 'pnpm'

      - name: Enable Corepack (pnpm via corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint
        run: |
          if pnpm run -s lint; then
            echo "Lint completed";
          else
            echo "No lint script or lint failed; continuing";
          fi

      - name: Build
        run: pnpm run build

      - name: Add .nojekyll file
        run: |
          mkdir -p dist
          touch ./dist/.nojekyll

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./dist
